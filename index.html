<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<meta name="theme-color" content="#f7b6cd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<div id="gate">
  <div class="balloons" id="balloons" aria-hidden="true"></div>
  <button id="open" type="button" aria-label="Open your birthday card">
    <span class="env"><span class="flap"></span><span class="to" id="gate-name"></span></span>
    <span class="hint">tap to open</span>
  </button>
</div>
<main id="app"></main>
<script src="script.js"></script>
</body>
</html>
